# Limpieza y segmentación del texto extraído con pdftotext.
version: "seg-2026.11.1"

# Líneas que se eliminan siempre (encabezados y pies de página).
noise_lines:
  - '^\s*CORTE CONSTITUCIONAL\s+DEL ECUADOR\s*$'
  - '^\s*P[áa]gina\s+\d+\s+de\s+\d+\s*$'
  - '^\s*\d{1,4}\s*$'
  - 'corteconstitucional\.gob\.ec'
  - '^\s*Email:\s'
  - '^\s*Quito:\s*José Tamayo'
  - '^\s*Telf\.?:'

# Una línea que se repite en al menos este número de páginas se considera encabezado o pie.
repeated_line_min_pages: 3

# Inicio de párrafo numerado: "12. Texto"
paragraph_start: '^\s*(?<num>\d{1,4})\.\s+(?<rest>\S.*)$'

# Títulos que no forman parte de ningún párrafo: "IV. Análisis", "3.2. Sobre ...", "Decisión".
headings:
  - '^\s*[IVXL]{1,6}\.\s+\S'
  - '^\s*\d{1,3}(?:\.\d{1,3})+\.?\s+\S'
  - '^\s*[a-z]\)\s+[A-ZÁÉÍÓÚ]'
  - '^\s*Decisi[óo]n\s*$'

metadata:
  ruling_number: '(?i:sentencia)\s+(?:No\.|N\.?\s?[°º]|n\.?\s?[°º])?\s*(?<v>\d{1,5}-\d{2}-[A-Z]{2}/\d{2}|\d{3}-\d{2}-S[A-Z]{2,3}-CC)'
  case_file: '(?i:caso)\s+(?:No\.|N\.?\s?[°º]|n\.?\s?[°º])?\s*(?<v>\d{1,5}-\d{2}-[A-Z]{2})'
  date: '(?<d>\d{1,2})\s+de\s+(?<m>enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre)\s+de\s+(?<y>\d{4})'
  rapporteur: '(?i:jueza?\s+(?:constitucional\s+)?ponente):?\s*(?<v>[^\n,.]{3,80})'
  decision_heading: '(?im)^\s*(?:[IVXL]{1,6}\.\s*)?Decisi[óo]n\s*$'

months:
  enero: 1
  febrero: 2
  marzo: 3
  abril: 4
  mayo: 5
  junio: 6
  julio: 7
  agosto: 8
  septiembre: 9
  setiembre: 9
  octubre: 10
  noviembre: 11
  diciembre: 12

# El primer patrón que aparezca después del título "Decisión" define la decisión.
decision_rules:
  - pattern: '(?i)\baceptar\s+parcialmente\b'
    value: partially_accepted
  - pattern: '(?i)\baceptar\b'
    value: accepted
  - pattern: '(?i)\bdesestimar\b'
    value: dismissed
  - pattern: '(?i)\brechazar\b'
    value: rejected
